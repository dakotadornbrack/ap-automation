[project]
name = "ap-automation"
version = "0.1.0"
description = "Invoice cleaning, duplicate detection and AP aging dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
