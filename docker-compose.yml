services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap -d ap"]
      interval: 3s
      timeout: 3s
      retries: 10

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql://ap:ap@db:5432/ap
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
